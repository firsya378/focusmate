<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - FocusMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-md fixed w-full top-0 z-50">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-8">
                    <h1 class="text-2xl font-bold text-purple-600">
                        <i class="fas fa-brain"></i> FocusMate
                    </h1>
                    <div class="hidden md:flex space-x-6">
                        <a href="dashboard.html" class="text-gray-700 hover:text-purple-600">Beranda</a>
                        <a href="tasks.html" class="text-gray-700 hover:text-purple-600">Tugas</a>
                        <a href="timer.html" class="text-gray-700 hover:text-purple-600">Timer</a>
                        <a href="ai-buddy.html" class="text-gray-700 hover:text-purple-600">AI Buddy</a>
                        <a href="admin/index.html" class="text-red-600 hover:text-red-700 hidden" id="adminLink">Panel Admin</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-gray-700" id="userName">Halo, User</span>
                    <a href="profile.html" class="text-gray-600 hover:text-purple-600">
                        <i class="fas fa-user-circle text-2xl"></i>
                    </a>
                    <a href="#" onclick="logout()" class="text-red-600 hover:text-red-700">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-6 pt-24 pb-12">
        <div class="max-w-2xl mx-auto">
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <div class="text-center mb-8">
                    <div class="w-24 h-24 rounded-full bg-purple-100 flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-user-circle text-5xl text-purple-600"></i>
                    </div>
                    <h2 class="text-2xl font-bold">Edit Profil</h2>
                </div>
                
                <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>
                <div id="successMessage" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4"></div>
                
                <form id="profileForm">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Nama Lengkap</label>
                        <input type="text" id="fullName" required 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                        <input type="email" id="email" required 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Status</label>
                        <select id="status" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                            <option value="Siswa">Siswa</option>
                            <option value="Mahasiswa" selected>Mahasiswa</option>
                            <option value="Guru">Guru</option>
                            <option value="Dosen">Dosen</option>
                            <option value="Umum">Umum</option>
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Tanggal Lahir</label>
                        <input type="date" id="birthDate" 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Password Baru (kosongkan jika tidak diubah)</label>
                        <input type="password" id="newPassword" 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                    </div>
                    
                    <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-lg font-bold hover:bg-purple-700 transition">
                        Simpan Perubahan
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', function() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            document.getElementById('userName').textContent = 'Halo, ' + user.full_name;
            if (user.role === 'admin') {
                document.getElementById('adminLink').classList.remove('hidden');
            }
            
            // Load profile data
            const fullUser = getUserById(user.user_id);
            if (fullUser) {
                document.getElementById('fullName').value = fullUser.full_name || '';
                document.getElementById('email').value = fullUser.email || '';
                document.getElementById('status').value = fullUser.status || 'Mahasiswa';
                document.getElementById('birthDate').value = fullUser.birth_date || '';
            }
        });

        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const data = {
                full_name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                status: document.getElementById('status').value,
                birth_date: document.getElementById('birthDate').value
            };
            
            const password = document.getElementById('newPassword').value;
            if (password) {
                // Update password di users array
                const users = DB.getUsers();
                const index = users.findIndex(u => u.id === currentUser.user_id);
                if (index !== -1) {
                    users[index].password = DB.hashPassword(password);
                    DB.set('focusmate_users', users);
                }
            }
            
            if (updateUserProfile(currentUser.user_id, data)) {
                document.getElementById('successMessage').textContent = 'Profil berhasil diperbarui!';
                document.getElementById('successMessage').classList.remove('hidden');
                document.getElementById('errorMessage').classList.add('hidden');
                document.getElementById('userName').textContent = 'Halo, ' + data.full_name;
            } else {
                document.getElementById('errorMessage').textContent = 'Gagal memperbarui profil';
                document.getElementById('errorMessage').classList.remove('hidden');
                document.getElementById('successMessage').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
