<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - FocusMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #FF6B35, #FF6B6B, #6C5CE7, #4ECDC4);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #FF6B35, #FF6B6B, #6C5CE7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: shimmer 3s ease-in-out infinite;
        }
        
        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .input-focus {
            transition: all 0.3s ease;
        }
        .input-focus:focus {
            border-color: #FF6B35;
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.15);
            transform: translateY(-1px);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #FF6B35, #FF6B6B);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 40px rgba(255, 107, 53, 0.4);
        }
        
        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.5s ease;
        }
        .btn-primary:hover::after {
            left: 100%;
        }
        
        .floating-shapes {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.2;
            animation: float 20s ease-in-out infinite;
        }
        .shape-1 { 
            width: 400px; height: 400px; 
            background: #FF6B35; 
            top: -100px; right: -100px;
            animation-delay: 0s;
        }
        .shape-2 { 
            width: 300px; height: 300px; 
            background: #6C5CE7; 
            bottom: -50px; left: -50px;
            animation-delay: -5s;
        }
        .shape-3 { 
            width: 200px; height: 200px; 
            background: #4ECDC4; 
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(20px, 30px) scale(1.02); }
        }
        
        .brand-icon {
            background: linear-gradient(135deg, #FF6B35, #FF6B6B, #6C5CE7);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .decorative-line {
            height: 4px;
            width: 60px;
            background: linear-gradient(90deg, #FF6B35, #FF6B6B, #6C5CE7, #4ECDC4);
            border-radius: 2px;
            margin: 0 auto;
        }

        .success-message {
            border-left: 4px solid #4ECDC4;
        }
        .error-message {
            border-left: 4px solid #FF6B6B;
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container mx-auto px-4 py-8 relative z-10 min-h-screen flex items-center justify-center">
        <div class="max-w-md mx-auto w-full">
            <div class="text-center mb-8">
                <div class="brand-icon inline-flex items-center justify-center w-20 h-20 rounded-2xl shadow-2xl mb-4">
                    <i class="fas fa-user-plus text-3xl text-white"></i>
                </div>
                <h1 class="text-3xl font-black gradient-text">Bergabung Sekarang</h1>
                <p class="text-white/90 mt-1 font-medium">Mulai perjalanan fokus Anda</p>
                <div class="decorative-line mt-3"></div>
            </div>
            
            <div class="glass-card rounded-3xl shadow-2xl p-8">
                <div id="errorMessage" class="hidden error-message bg-red-50 text-red-700 px-4 py-3 rounded-xl mb-4"></div>
                <div id="successMessage" class="hidden success-message bg-emerald-50 text-emerald-700 px-4 py-3 rounded-xl mb-4"></div>
                
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="block text-gray-700 text-sm font-semibold mb-2">
                            <i class="fas fa-user text-[#FF6B35] mr-2"></i>Username
                        </label>
                        <input type="text" id="username" required 
                               placeholder="Pilih username unik"
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition bg-white/50">
                    </div>
                    
                    <div class="mb-3">
                        <label class="block text-gray-700 text-sm font-semibold mb-2">
                            <i class="fas fa-user-circle text-[#FF6B35] mr-2"></i>Nama Lengkap
                        </label>
                        <input type="text" id="fullName" required 
                               placeholder="Masukkan nama lengkap"
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition bg-white/50">
                    </div>
                    
                    <div class="mb-3">
                        <label class="block text-gray-700 text-sm font-semibold mb-2">
                            <i class="fas fa-envelope text-[#FF6B35] mr-2"></i>Email
                        </label>
                        <input type="email" id="email" required 
                               placeholder="Masukkan email aktif"
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition bg-white/50">
                    </div>
                    
                    <div class="mb-3">
                        <label class="block text-gray-700 text-sm font-semibold mb-2">
                            <i class="fas fa-lock text-[#FF6B35] mr-2"></i>Password
                        </label>
                        <input type="password" id="password" required 
                               placeholder="Minimal 6 karakter"
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition bg-white/50">
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-semibold mb-2">
                            <i class="fas fa-check-circle text-[#FF6B35] mr-2"></i>Konfirmasi Password
                        </label>
                        <input type="password" id="confirmPassword" required 
                               placeholder="Ulangi password"
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition bg-white/50">
                    </div>
                    
                    <button type="submit" 
                            class="btn-primary w-full text-white py-3.5 rounded-xl font-bold text-lg shadow-lg">
                        <i class="fas fa-rocket mr-2"></i>Daftar Sekarang
                    </button>
                </form>
                
                <div class="mt-6 text-center">
                    <p class="text-gray-500">
                        Sudah punya akun? 
                        <a href="login.html" class="text-[#FF6B35] font-semibold hover:text-[#FF6B6B] transition">
                            Masuk di sini
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const result = registerUser(username, fullName, email, password, confirmPassword);
            if (result.success) {
                const successDiv = document.getElementById('successMessage');
                successDiv.innerHTML = '<i class="fas fa-check-circle mr-2"></i>' + result.message + ' <a href="login.html" class="font-bold underline hover:no-underline">Login di sini</a>';
                successDiv.classList.remove('hidden');
                document.getElementById('errorMessage').classList.add('hidden');
            } else {
                const errorDiv = document.getElementById('errorMessage');
                errorDiv.innerHTML = '<i class="fas fa-exclamation-circle mr-2"></i>' + result.message;
                errorDiv.classList.remove('hidden');
                document.getElementById('successMessage').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
