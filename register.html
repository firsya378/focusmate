<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - FocusMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .gradient-text {
            background: linear-gradient(135deg, #6C63FF, #4F46E5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .input-focus {
            transition: all 0.3s ease;
        }
        .input-focus:focus {
            border-color: #6C63FF;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.15);
            transform: translateY(-1px);
        }
        .btn-primary {
            background: linear-gradient(135deg, #6C63FF, #4F46E5);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(108, 99, 255, 0.4);
        }
        .floating-shapes {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            overflow: hidden;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
        }
        .shape-1 { width: 400px; height: 400px; background: #6C63FF; top: -100px; right: -100px; }
        .shape-2 { width: 300px; height: 300px; background: #4F46E5; bottom: -50px; left: -50px; }
        .shape-3 { width: 200px; height: 200px; background: #10B981; top: 50%; left: 50%; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-purple-50 to-emerald-50">
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container mx-auto px-4 py-8 relative z-10">
        <div class="max-w-md mx-auto">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-purple-600 to-indigo-600 shadow-2xl mb-4">
                    <i class="fas fa-user-plus text-3xl text-white"></i>
                </div>
                <h1 class="text-3xl font-black gradient-text">Bergabung Sekarang</h1>
                <p class="text-gray-500 mt-1 font-medium">Mulai perjalanan fokus Anda</p>
            </div>
            
            <div class="glass-card rounded-3xl shadow-2xl p-8">
                <div id="errorMessage" class="hidden bg-red-50 border-l-4 border-red-500 text-red-700 px-4 py-3 rounded-xl mb-4"></div>
                <div id="successMessage" class="hidden bg-emerald-50 border-l-4 border-emerald-500 text-emerald-700 px-4 py-3 rounded-xl mb-4"></div>
                
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="block text-gray-700 text-sm font-semibold mb-2">
                            <i class="fas fa-user text-purple-500 mr-2"></i>Username
                        </label>
                        <input type="text" id="username" required 
                               placeholder="Pilih username unik"
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition">
                    </div>
                    
                    <div class="mb-3">
                        <label class="block text-gray-700 text-sm font-semibold mb-2">
                            <i class="fas fa-user-circle text-purple-500 mr-2"></i>Nama Lengkap
                        </label>
                        <input type="text" id="fullName" required 
                               placeholder="Masukkan nama lengkap"
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition">
                    </div>
                    
                    <div class="mb-3">
                        <label class="block text-gray-700 text-sm font-semibold mb-2">
                            <i class="fas fa-envelope text-purple-500 mr-2"></i>Email
                        </label>
                        <input type="email" id="email" required 
                               placeholder="Masukkan email aktif"
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition">
                    </div>
                    
                    <div class="mb-3">
                        <label class="block text-gray-700 text-sm font-semibold mb-2">
                            <i class="fas fa-lock text-purple-500 mr-2"></i>Password
                        </label>
                        <input type="password" id="password" required 
                               placeholder="Minimal 6 karakter"
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition">
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-semibold mb-2">
                            <i class="fas fa-check-circle text-purple-500 mr-2"></i>Konfirmasi Password
                        </label>
                        <input type="password" id="confirmPassword" required 
                               placeholder="Ulangi password"
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition">
                    </div>
                    
                    <button type="submit" 
                            class="btn-primary w-full text-white py-3.5 rounded-xl font-bold text-lg shadow-lg">
                        <i class="fas fa-rocket mr-2"></i>Daftar Sekarang
                    </button>
                </form>
                
                <div class="mt-6 text-center">
                    <p class="text-gray-500">
                        Sudah punya akun? 
                        <a href="login.html" class="text-purple-600 font-semibold hover:text-purple-700 transition">
                            Masuk di sini
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const result = registerUser(username, fullName, email, password, confirmPassword);
            if (result.success) {
                const successDiv = document.getElementById('successMessage');
                successDiv.innerHTML = '<i class="fas fa-check-circle mr-2"></i>' + result.message + ' <a href="login.html" class="font-bold underline hover:no-underline">Login di sini</a>';
                successDiv.classList.remove('hidden');
                document.getElementById('errorMessage').classList.add('hidden');
            } else {
                const errorDiv = document.getElementById('errorMessage');
                errorDiv.innerHTML = '<i class="fas fa-exclamation-circle mr-2"></i>' + result.message;
                errorDiv.classList.remove('hidden');
                document.getElementById('successMessage').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
