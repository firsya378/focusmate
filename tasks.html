<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Tugas - FocusMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #6C63FF, #4F46E5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-link {
            transition: all 0.3s ease;
            position: relative;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #6C63FF, #4F46E5);
            transition: width 0.3s ease;
        }
        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }
        .nav-link.active {
            color: #6C63FF;
            font-weight: 600;
        }
        .gradient-card {
            background: linear-gradient(135deg, #6C63FF, #4F46E5);
        }
        .input-focus {
            transition: all 0.3s ease;
        }
        .input-focus:focus {
            border-color: #6C63FF;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.12);
            transform: translateY(-1px);
        }
        .btn-primary {
            background: linear-gradient(135deg, #6C63FF, #4F46E5);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(108, 99, 255, 0.3);
        }
        .task-card {
            transition: all 0.3s ease;
            border: 1px solid #F1F5F9;
        }
        .task-card:hover {
            border-color: rgba(108, 99, 255, 0.2);
            box-shadow: 0 8px 25px rgba(108, 99, 255, 0.08);
            transform: translateY(-2px);
        }
        .badge-priority-high { background: #FEE2E2; color: #DC2626; }
        .badge-priority-medium { background: #FEF3C7; color: #D97706; }
        .badge-priority-low { background: #D1FAE5; color: #059669; }
        .badge-status-pending { background: #E0E7FF; color: #4F46E5; }
        .badge-status-completed { background: #D1FAE5; color: #059669; }
        .badge-status-cancelled { background: #FEE2E2; color: #DC2626; }
        .modal-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-white to-indigo-50/30 min-h-screen">
    <!-- Navigasi -->
    <nav class="bg-white/80 backdrop-blur-xl shadow-sm fixed w-full top-0 z-50 border-b border-gray-100">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-10">
                    <div class="flex items-center space-x-2">
                        <div class="w-9 h-9 rounded-xl gradient-card flex items-center justify-center shadow-lg">
                            <i class="fas fa-brain text-white text-lg"></i>
                        </div>
                        <h1 class="text-2xl font-black gradient-text">FocusMate</h1>
                    </div>
                    <div class="hidden md:flex space-x-6">
                        <a href="dashboard.html" class="nav-link text-gray-500 hover:text-gray-700">Beranda</a>
                        <a href="tasks.html" class="nav-link active text-gray-700">Tugas</a>
                        <a href="timer.html" class="nav-link text-gray-500 hover:text-gray-700">Timer</a>
                        <a href="ai-buddy.html" class="nav-link text-gray-500 hover:text-gray-700">AI Buddy</a>
                        <a href="admin/index.html" class="nav-link text-gray-500 hover:text-gray-700 hidden" id="adminLink">
                            <i class="fas fa-shield-alt text-red-500 mr-1"></i>Admin
                        </a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm font-medium text-gray-700" id="userName">Halo, User</span>
                    <a href="profile.html" class="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-purple-50 hover:text-purple-600 transition">
                        <i class="fas fa-user-circle text-xl"></i>
                    </a>
                    <button onclick="logout()" class="w-9 h-9 rounded-xl bg-red-50 flex items-center justify-center text-red-500 hover:bg-red-100 transition">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-6 pt-28 pb-12">
        <!-- Header -->
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-800">📋 Manajemen Tugas</h2>
            <p class="text-gray-500 mt-1">Atur dan kelola semua tugas belajarmu di sini</p>
        </div>

        <!-- Form Tambah Tugas -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8">
            <h3 class="text-lg font-bold text-gray-800 mb-4">
                <i class="fas fa-plus-circle text-purple-600 mr-2"></i>Tambah Tugas Baru
            </h3>
            <form id="addTaskForm" class="space-y-4">
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <input type="text" id="taskName" placeholder="Nama Tugas" required 
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition">
                    </div>
                    <div>
                        <select id="taskPriority" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition">
                            <option value="Rendah">🔵 Prioritas Rendah</option>
                            <option value="Sedang" selected>🟡 Prioritas Sedang</option>
                            <option value="Tinggi">🔴 Prioritas Tinggi</option>
                        </select>
                    </div>
                </div>
                <div>
                    <textarea id="taskDescription" placeholder="Deskripsi tugas (opsional)" rows="2" 
                              class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition"></textarea>
                </div>
                <div class="grid md:grid-cols-3 gap-4">
                    <input type="date" id="taskDate" 
                           class="px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition">
                    <input type="time" id="startTime" placeholder="Mulai" 
                           class="px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition">
                    <input type="time" id="endTime" placeholder="Selesai" 
                           class="px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition">
                </div>
                <button type="submit" class="btn-primary text-white px-8 py-3 rounded-xl font-bold shadow-lg">
                    <i class="fas fa-save mr-2"></i>Simpan Tugas
                </button>
            </form>
        </div>

        <!-- Daftar Tugas -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-bold text-gray-800">
                    <i class="fas fa-list text-purple-600 mr-2"></i>Daftar Tugas Saya
                </h3>
                <span class="text-sm text-gray-500" id="taskCount">0 tugas</span>
            </div>
            <div id="taskList" class="space-y-3">
                <div class="text-center py-12">
                    <div class="w-20 h-20 rounded-full bg-purple-100 flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-clipboard-list text-4xl text-purple-400"></i>
                    </div>
                    <p class="text-gray-500 font-medium">Belum ada tugas</p>
                    <p class="text-sm text-gray-400">Buat tugas pertama Anda di atas!</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Edit -->
    <div id="editModal" class="fixed inset-0 modal-overlay hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4 shadow-2xl">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-gray-800">
                    <i class="fas fa-edit text-purple-600 mr-2"></i>Edit Tugas
                </h3>
                <button onclick="closeEditModal()" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 transition flex items-center justify-center text-gray-500">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="editTaskForm">
                <input type="hidden" id="editTaskId">
                <input type="text" id="editTaskName" required 
                       class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition mb-3">
                <textarea id="editTaskDescription" rows="3" 
                          class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition mb-3"></textarea>
                <input type="date" id="editTaskDate" 
                       class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition mb-3">
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <input type="time" id="editStartTime" 
                           class="px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition">
                    <input type="time" id="editEndTime" 
                           class="px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition">
                </div>
                <select id="editPriority" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition mb-3">
                    <option value="Rendah">🔵 Prioritas Rendah</option>
                    <option value="Sedang">🟡 Prioritas Sedang</option>
                    <option value="Tinggi">🔴 Prioritas Tinggi</option>
                </select>
                <select id="editStatus" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl input-focus outline-none transition mb-4">
                    <option value="pending">⏳ Tertunda</option>
                    <option value="completed">✅ Selesai</option>
                    <option value="cancelled">❌ Dibatalkan</option>
                </select>
                <div class="flex space-x-3">
                    <button type="submit" class="flex-1 btn-primary text-white py-3 rounded-xl font-bold shadow-lg">
                        <i class="fas fa-save mr-2"></i>Simpan
                    </button>
                    <button type="button" onclick="closeEditModal()" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-200 transition">
                        Batal
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let currentUserId = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUserId = user.user_id;
            document.getElementById('userName').textContent = 'Halo, ' + user.full_name;
            if (user.role === 'admin') {
                document.getElementById('adminLink').classList.remove('hidden');
            }
            renderTasks();
        });

        document.getElementById('addTaskForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                task_name: document.getElementById('taskName').value,
                description: document.getElementById('taskDescription').value,
                task_date: document.getElementById('taskDate').value,
                start_time: document.getElementById('startTime').value,
                end_time: document.getElementById('endTime').value,
                priority: document.getElementById('taskPriority').value
            };
            addTask(currentUserId, data);
            this.reset();
            renderTasks();
            showToast('Tugas berhasil ditambahkan!', 'success');
        });

        document.getElementById('editTaskForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const taskId = parseInt(document.getElementById('editTaskId').value);
            const data = {
                task_name: document.getElementById('editTaskName').value,
                description: document.getElementById('editTaskDescription').value,
                task_date: document.getElementById('editTaskDate').value,
                start_time: document.getElementById('editStartTime').value,
                end_time: document.getElementById('editEndTime').value,
                priority: document.getElementById('editPriority').value,
                status: document.getElementById('editStatus').value
            };
            updateTask(taskId, data);
            closeEditModal();
            renderTasks();
            showToast('Tugas berhasil diperbarui!', 'success');
        });

        function renderTasks() {
            const tasks = getTasks(currentUserId);
            const container = document.getElementById('taskList');
            document.getElementById('taskCount').textContent = tasks.length + ' tugas';
            
            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <div class="w-20 h-20 rounded-full bg-purple-100 flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-clipboard-list text-4xl text-purple-400"></i>
                        </div>
                        <p class="text-gray-500 font-medium">Belum ada tugas</p>
                        <p class="text-sm text-gray-400">Buat tugas pertama Anda di atas!</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            tasks.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            tasks.forEach(task => {
                const priorityBadge = task.priority === 'Tinggi' ? 'badge-priority-high' : 
                                     (task.priority === 'Sedang' ? 'badge-priority-medium' : 'badge-priority-low');
                const statusBadge = task.status === 'pending' ? 'badge-status-pending' : 
                                   (task.status === 'completed' ? 'badge-status-completed' : 'badge-status-cancelled');
                const statusText = task.status === 'pending' ? 'Tertunda' : 
                                  (task.status === 'completed' ? 'Selesai' : 'Dibatalkan');
                
                html += `
                    <div class="task-card bg-slate-50 rounded-xl p-4">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-1">
                                    <h3 class="font-semibold text-gray-800">${escapeHtml(task.task_name)}</h3>
                                    <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${priorityBadge}">${task.priority}</span>
                                    <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${statusBadge}">${statusText}</span>
                                </div>
                                ${task.description ? `<p class="text-sm text-gray-500 mb-2">${escapeHtml(task.description)}</p>` : ''}
                                <div class="flex flex-wrap gap-3 text-xs text-gray-400">
                                    ${task.task_date ? `<span><i class="far fa-calendar mr-1"></i>${task.task_date}</span>` : ''}
                                    ${task.start_time ? `<span><i class="far fa-clock mr-1"></i>${task.start_time} - ${task.end_time}</span>` : ''}
                                </div>
                            </div>
                            <div class="flex space-x-2 ml-4">
                                <button onclick="editTask(${task.id})" class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 transition flex items-center justify-center">
                                    <i class="fas fa-edit text-sm"></i>
                                </button>
                                <button onclick="deleteTaskHandler(${task.id})" class="w-8 h-8 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition flex items-center justify-center">
                                    <i class="fas fa-trash text-sm"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function editTask(taskId) {
            const tasks = getTasks(currentUserId);
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            
            document.getElementById('editTaskId').value = task.id;
            document.getElementById('editTaskName').value = task.task_name;
            document.getElementById('editTaskDescription').value = task.description || '';
            document.getElementById('editTaskDate').value = task.task_date || '';
            document.getElementById('editStartTime').value = task.start_time || '';
            document.getElementById('editEndTime').value = task.end_time || '';
            document.getElementById('editPriority').value = task.priority;
            document.getElementById('editStatus').value = task.status;
            document.getElementById('editModal').classList.remove('hidden');
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            document.getElementById('editModal').classList.add('hidden');
        }

        function deleteTaskHandler(taskId) {
            if (confirm('Yakin ingin menghapus tugas ini?')) {
                deleteTask(taskId, currentUserId);
                renderTasks();
                showToast('Tugas berhasil dihapus', 'info');
            }
        }

        function showToast(message, type) {
            const colors = {
                success: 'bg-emerald-500',
                error: 'bg-red-500',
                info: 'bg-blue-500'
            };
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            const toast = document.createElement('div');
            toast.className = `fixed bottom-4 right-4 ${colors[type] || 'bg-gray-800'} text-white px-6 py-3 rounded-xl shadow-lg flex items-center gap-3 animate-bounce z-50`;
            toast.innerHTML = `<i class="fas ${icons[type] || 'fa-info-circle'}"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
