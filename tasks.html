    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #6C63FF, #4F46E5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-link {
            transition: all 0.3s ease;
            position: relative;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #6C63FF, #4F46E5);
            transition: width 0.3s ease;
        }
        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }
        .nav-link.active {
            color: #6C63FF;
            font-weight: 600;
        }
        .gradient-card {
            background: linear-gradient(135deg, #6C63FF, #4F46E5);
        }
        .input-focus {
            transition: all 0.3s ease;
        }
        .input-focus:focus {
            border-color: #6C63FF;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.12);
            transform: translateY(-1px);
        }
        .btn-primary {
            background: linear-gradient(135deg, #6C63FF, #4F46E5);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(108, 99, 255, 0.3);
        }
        .task-card {
            transition: all 0.3s ease;
            border: 1px solid #F1F5F9;
        }
        .task-card:hover {
            border-color: rgba(108, 99, 255, 0.2);
            box-shadow: 0 8px 25px rgba(108, 99, 255, 0.08);
            transform: translateY(-2px);
        }
        .badge-priority-high { background: #FEE2E2; color: #DC2626; }
        .badge-priority-medium { background: #FEF3C7; color: #D97706; }
        .badge-priority-low { background: #D1FAE5; color: #059669; }
        .badge-status-pending { background: #E0E7FF; color: #4F46E5; }
        .badge-status-completed { background: #D1FAE5; color: #059669; }
        .badge-status-cancelled { background: #FEE2E2; color: #DC2626; }
        .modal-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
