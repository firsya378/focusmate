<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FocusMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <!-- Navigasi -->
    <nav class="bg-white shadow-md fixed w-full top-0 z-50">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-8">
                    <h1 class="text-2xl font-bold text-purple-600">
                        <i class="fas fa-brain"></i> FocusMate
                    </h1>
                    <div class="hidden md:flex space-x-6">
                        <a href="dashboard.html" class="text-purple-600 font-semibold">Beranda</a>
                        <a href="tasks.html" class="text-gray-700 hover:text-purple-600">Tugas</a>
                        <a href="timer.html" class="text-gray-700 hover:text-purple-600">Timer</a>
                        <a href="ai-buddy.html" class="text-gray-700 hover:text-purple-600">AI Buddy</a>
                        <a href="admin/index.html" class="text-red-600 hover:text-red-700 hidden" id="adminLink">Panel Admin</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-gray-700" id="userName">Halo, User</span>
                    <a href="profile.html" class="text-gray-600 hover:text-purple-600">
                        <i class="fas fa-user-circle text-2xl"></i>
                    </a>
                    <a href="#" onclick="logout()" class="text-red-600 hover:text-red-700">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Konten Utama -->
    <div class="container mx-auto px-6 pt-24 pb-12">
        <!-- Kartu Statistik -->
        <div class="grid md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Total Sesi Belajar</p>
                        <p class="text-3xl font-bold text-purple-600" id="totalSessions">0</p>
                    </div>
                    <i class="fas fa-clock text-4xl text-purple-200"></i>
                </div>
            </div>
            
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Total Waktu Belajar</p>
                        <p class="text-3xl font-bold text-purple-600" id="totalTime">0 jam</p>
                    </div>
                    <i class="fas fa-hourglass-half text-4xl text-purple-200"></i>
                </div>
            </div>
            
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Tugas Selesai</p>
                        <p class="text-3xl font-bold text-green-600" id="completedTasks">0</p>
                    </div>
                    <i class="fas fa-check-circle text-4xl text-green-200"></i>
                </div>
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
            <!-- Tugas Tertunda -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <h2 class="text-xl font-bold mb-4">Tugas Tertunda</h2>
                <div id="pendingTasks">
                    <p class="text-gray-500 text-center py-8">Tidak ada tugas tertunda. Bagus!</p>
                </div>
                <a href="tasks.html" class="block text-center mt-4 text-purple-600 hover:underline">Lihat semua tugas →</a>
            </div>

            <!-- Timer Fokus -->
            <div class="bg-gradient-to-br from-purple-600 to-indigo-600 rounded-xl shadow-md p-6 text-white">
                <h2 class="text-xl font-bold mb-4">Timer Fokus</h2>
                <p class="mb-4">Mulai sesi belajar fokus dengan teknik Pomodoro</p>
                <a href="timer.html" class="inline-block bg-white text-purple-600 px-6 py-2 rounded-lg font-semibold hover:bg-gray-100 transition">
                    Mulai Timer →
                </a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            // Tampilkan nama user
            document.getElementById('userName').textContent = 'Halo, ' + user.full_name;
            
            // Tampilkan link admin jika admin
            if (user.role === 'admin') {
                document.getElementById('adminLink').classList.remove('hidden');
            }
            
            // Load stats
            const stats = getStudyStats(user.user_id);
            document.getElementById('totalSessions').textContent = stats.total_sessions || 0;
            document.getElementById('totalTime').textContent = Math.round((stats.total_time || 0) / 60) + ' jam';
            
            // Load completed tasks
            const tasks = getTasksByStatus(user.user_id, 'completed');
            document.getElementById('completedTasks').textContent = tasks.length;
            
            // Load pending tasks
            const pending = getTasksByStatus(user.user_id, 'pending');
            const container = document.getElementById('pendingTasks');
            if (pending.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">Tidak ada tugas tertunda. Bagus!</p>';
            } else {
                let html = '<div class="space-y-3">';
                pending.slice(0, 5).forEach(task => {
                    const priorityColor = task.priority === 'Tinggi' ? 'bg-red-100 text-red-700' : 
                                         (task.priority === 'Sedang' ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700');
                    html += `
                        <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                            <div>
                                <h3 class="font-semibold">${escapeHtml(task.task_name)}</h3>
                                <p class="text-sm text-gray-500">Tenggat: ${task.task_date || 'Tidak ada tanggal'}</p>
                            </div>
                            <span class="px-2 py-1 text-xs rounded-full ${priorityColor}">${task.priority}</span>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            }
        });
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
