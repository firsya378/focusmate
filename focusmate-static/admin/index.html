<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - FocusMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-md p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-purple-600">Panel Admin</h1>
            <div class="flex space-x-4">
                <a href="../dashboard.html" class="text-gray-600 hover:text-purple-600">Kembali ke Dashboard</a>
                <a href="#" onclick="logout()" class="text-red-600 hover:text-red-700">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-6 py-8">
        <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>
        <div id="successMessage" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4"></div>

        <h2 class="text-2xl font-bold mb-6">Kelola Pengguna</h2>
        <div class="bg-white rounded-xl shadow-md overflow-hidden mb-8">
            <table class="min-w-full">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-3 text-left">ID</th>
                        <th class="px-6 py-3 text-left">Nama</th>
                        <th class="px-6 py-3 text-left">Email</th>
                        <th class="px-6 py-3 text-left">Role</th>
                        <th class="px-6 py-3 text-left">Status</th>
                        <th class="px-6 py-3 text-left">Aksi</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="6" class="text-center py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <h2 class="text-2xl font-bold mb-6">Semua Tugas</h2>
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <table class="min-w-full">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-3 text-left">Tugas</th>
                        <th class="px-6 py-3 text-left">Pengguna</th>
                        <th class="px-6 py-3 text-left">Prioritas</th>
                        <th class="px-6 py-3 text-left">Status</th>
                        <th class="px-6 py-3 text-left">Tanggal</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                    <tr><td colspan="5" class="text-center py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = '../login.html';
                return;
            }
            if (user.role !== 'admin') {
                window.location.href = '../dashboard.html';
                return;
            }
            
            renderUsers();
            renderAllTasks();
        });

        function renderUsers() {
            const users = getAllUsers();
            const tbody = document.getElementById('userTableBody');
            
            let html = '';
            users.forEach(user => {
                html += `
                    <tr class="border-t">
                        <td class="px-6 py-3">${user.id}</td>
                        <td class="px-6 py-3">${escapeHtml(user.full_name)}</td>
                        <td class="px-6 py-3">${escapeHtml(user.email)}</td>
                        <td class="px-6 py-3">
                            <select onchange="updateRole(${user.id}, this.value)" 
                                    class="px-2 py-1 border rounded ${user.role === 'admin' ? 'bg-purple-100' : ''}">
                                <option value="user" ${user.role === 'user' ? 'selected' : ''}>User</option>
                                <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Admin</option>
                            </select>
                        </td>
                        <td class="px-6 py-3">${escapeHtml(user.status || '-')}</td>
                        <td class="px-6 py-3">
                            ${user.role !== 'admin' ? `
                                <button onclick="deleteUserHandler(${user.id})" class="text-red-600 hover:text-red-800">
                                    <i class="fas fa-trash"></i>
                                </button>
                            ` : '-'}
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function renderAllTasks() {
            const tasks = getAllTasks();
            const tbody = document.getElementById('taskTableBody');
            
            if (tasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4">Belum ada tugas</td></tr>';
                return;
            }
            
            let html = '';
            tasks.forEach(task => {
                const priorityColor = task.priority === 'Tinggi' ? 'bg-red-100 text-red-700' : 
                                     (task.priority === 'Sedang' ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700');
                const statusText = task.status === 'pending' ? 'Tertunda' : (task.status === 'completed' ? 'Selesai' : 'Dibatalkan');
                
                html += `
                    <tr class="border-t">
                        <td class="px-6 py-3">${escapeHtml(task.task_name)}</td>
                        <td class="px-6 py-3">${escapeHtml(task.user_name || 'Unknown')}</td>
                        <td class="px-6 py-3">
                            <span class="px-2 py-1 rounded-full text-xs ${priorityColor}">${task.priority}</span>
                        </td>
                        <td class="px-6 py-3">${statusText}</td>
                        <td class="px-6 py-3">${task.task_date || '-'}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function updateRole(userId, role) {
            if (updateUserRole(userId, role)) {
                showMessage('Role user berhasil diupdate', 'success');
                renderUsers();
            }
        }

        function deleteUserHandler(userId) {
            if (confirm('Hapus user ini?')) {
                if (deleteUser(userId)) {
                    showMessage('User berhasil dihapus', 'success');
                    renderUsers();
                } else {
                    showMessage('Gagal menghapus user (admin tidak bisa dihapus)', 'error');
                }
            }
        }

        function showMessage(text, type) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            
            if (type === 'error') {
                errorDiv.textContent = text;
                errorDiv.classList.remove('hidden');
            } else {
                successDiv.textContent = text;
                successDiv.classList.remove('hidden');
            }
            
            setTimeout(() => {
                errorDiv.classList.add('hidden');
                successDiv.classList.add('hidden');
            }, 3000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
